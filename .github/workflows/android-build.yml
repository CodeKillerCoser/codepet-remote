name: Android APK

run-name: Android APK · ${{ github.ref_name }} · ${{ inputs.build_mode }}

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: APK build mode
        type: choice
        required: true
        default: release
        options:
          - release
          - debug

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # workflow_dispatch checks out the branch chosen in "Use workflow from".
      - name: Checkout selected branch
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        env:
          BUILD_MODE: ${{ inputs.build_mode }}
          CODEPET_RELEASE_KEYSTORE_BASE64: ${{ inputs.build_mode == 'release' && secrets.CODEPET_RELEASE_KEYSTORE_BASE64 || '' }}
          CODEPET_RELEASE_STORE_PASSWORD: ${{ inputs.build_mode == 'release' && secrets.CODEPET_RELEASE_STORE_PASSWORD || '' }}
          CODEPET_RELEASE_KEY_ALIAS: ${{ inputs.build_mode == 'release' && secrets.CODEPET_RELEASE_KEY_ALIAS || '' }}
          CODEPET_RELEASE_KEY_PASSWORD: ${{ inputs.build_mode == 'release' && secrets.CODEPET_RELEASE_KEY_PASSWORD || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$BUILD_MODE" == release ]]; then
            for name in CODEPET_RELEASE_KEYSTORE_BASE64 CODEPET_RELEASE_STORE_PASSWORD CODEPET_RELEASE_KEY_ALIAS CODEPET_RELEASE_KEY_PASSWORD; do
              if [[ -z "${!name}" ]]; then
                echo "::error::Missing repository secret: $name"
                exit 1
              fi
            done
            umask 077
            export CODEPET_RELEASE_STORE_FILE="$RUNNER_TEMP/codepet-release.jks"
            trap 'rm -f "$CODEPET_RELEASE_STORE_FILE"' EXIT
            printf '%s' "$CODEPET_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$CODEPET_RELEASE_STORE_FILE"
            unset CODEPET_RELEASE_KEYSTORE_BASE64
          fi
          flutter build apk --"$BUILD_MODE"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: codepet-remote-${{ inputs.build_mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/app/outputs/flutter-apk/app-${{ inputs.build_mode }}.apk
          if-no-files-found: error
          retention-days: 14
